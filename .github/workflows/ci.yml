name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile scripts/*.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Offline demo runs
        run: python scripts/make_demo.py
      - name: Demo products are reproducible (no diff)
        run: git diff --exit-code -- examples docs/sample-settlement.svg docs/sample-settlement.html
